tags:
  - name: produtos
    description: Produtos e serviços de uma empresa e importação por planilha

paths:
  /produtos/empresa/{empresaId}:
    get:
      tags: [produtos]
      summary: Produtos disponíveis de uma empresa (pública)
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      responses:
        '200':
          description: Lista de produtos, em ordem alfabética
          content:
            application/json:
              example:
                - { id_produto: 1, empresa_id: 1, tipo_item: produto, nome: Pão francês, preco: "1.50", unidade_medida: un, disponivel: true, categoria_nome: Alimentação }
        '500': { $ref: '#/components/responses/ErroServidor' }

  /produtos:
    post:
      tags: [produtos]
      summary: Cria um produto ou serviço
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [empresa_id, nome, preco]
              properties:
                empresa_id: { type: integer }
                tipo_item: { type: string, enum: [produto, servico], default: produto }
                nome: { type: string }
                categoria_id: { type: integer, nullable: true }
                descricao: { type: string }
                preco: { type: number }
                unidade_medida: { type: string, default: un }
                foto_url: { type: string, nullable: true, description: URL da foto do produto }
            example:
              empresa_id: 1
              nome: Pão francês
              preco: 1.5
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              example: { id_produto: 1, empresa_id: 1, tipo_item: produto, nome: Pão francês, preco: "1.50", unidade_medida: un, disponivel: true }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/SemToken' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '500': { $ref: '#/components/responses/ErroServidor' }

  /produtos/{empresaId}/planilha:
    post:
      tags: [produtos]
      summary: Importa produtos de uma planilha (wizard, passos 11 e 12)
      description: |
        Aceita .xlsx, .xls ou .csv no campo `planilha`. Colunas da primeira aba:
        **Tipo de Item** (Produto ou Serviço), **Nome do Item**, **Categoria** (uma das cadastradas),
        **Preço Regular** (número maior que zero) e **Unidade de Medida** (un, kg, hora...).
        Se qualquer linha tiver erro, nada é gravado e a resposta lista os problemas por linha.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [planilha]
              properties:
                planilha: { type: string, format: binary }
      responses:
        '201':
          description: Planilha importada
          content:
            application/json:
              example: { mensagem: 12 itens importados com sucesso. }
        '400':
          description: Arquivo faltando, formato errado ou linhas inválidas
          content:
            application/json:
              example:
                erro: A planilha tem linhas inválidas.
                totalLinhas: 3
                detalhes:
                  - linha: 2
                    problemas:
                      - { coluna: Preço Regular, motivo: deve ser um número maior que zero }
        '401': { $ref: '#/components/responses/SemToken' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '500': { $ref: '#/components/responses/ErroServidor' }

  /produtos/{id}:
    put:
      tags: [produtos]
      summary: Edita um produto ou serviço (só o dono)
      description: Só os campos enviados mudam. Em `descricao`, `foto_url` e `categoria_id`, `null` ou texto vazio apaga o valor.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: Número do produto (id_produto)
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string, maxLength: 150 }
                preco: { type: number, exclusiveMinimum: true, minimum: 0 }
                tipo_item: { type: string, enum: [produto, servico] }
                unidade_medida: { type: string, maxLength: 20 }
                descricao: { type: string, nullable: true }
                foto_url: { type: string, nullable: true, maxLength: 500 }
                categoria_id: { type: integer, nullable: true }
            example: { preco: 2 }
      responses:
        '200':
          description: Produto editado
          content:
            application/json:
              example: { id_produto: 1, empresa_id: 1, tipo_item: produto, nome: Pão francês, preco: "2.00", unidade_medida: un, disponivel: true }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/SemToken' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404':
          description: Produto não existe ou já foi removido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: Produto não encontrado. }
        '500': { $ref: '#/components/responses/ErroServidor' }
    delete:
      tags: [produtos]
      summary: Remove um produto ou serviço (só o dono)
      description: |
        O produto fica com `disponivel = false`: some da lista da empresa e das ofertas ligadas a ele,
        mas continua no banco.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: Número do produto (id_produto)
          example: 1
      responses:
        '200':
          description: Produto removido
          content:
            application/json:
              example: { mensagem: Produto removido. }
        '401': { $ref: '#/components/responses/SemToken' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404':
          description: Produto não existe ou já foi removido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: Produto não encontrado. }
        '500': { $ref: '#/components/responses/ErroServidor' }

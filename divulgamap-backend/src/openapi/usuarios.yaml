tags:
  - name: usuarios
    description: Dados do usuário logado e troca de senha

paths:
  /usuarios/me:
    get:
      tags: [usuarios]
      summary: Dados do usuário logado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Dados do usuário (sem a senha)
          content:
            application/json:
              example:
                id: 1
                nome: Teste
                email: teste@teste.com
                tipo: consumidor
                telefone: "51999990000"
                foto_perfil_url: null
                biografia: Iniciando uma jornada pelos lugares de Taquara!
                data_nascimento: "2008-05-10"
                conta_privada: false
                notificacoes_ativas: true
                preferencias_notificacao: { ofertas_gerais: true, empresas_proximas: true, recomendacoes: false }
                data_cadastro: "2026-10-27T18:00:00.000Z"
        '401': { $ref: '#/components/responses/SemToken' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '500': { $ref: '#/components/responses/ErroServidor' }
    put:
      tags: [usuarios]
      summary: Atualiza os dados do perfil e as preferências
      description: Só os campos enviados mudam. `null` apaga o campo (menos o nome).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string, maxLength: 100 }
                telefone: { type: string, nullable: true, maxLength: 20 }
                biografia: { type: string, nullable: true, maxLength: 500 }
                data_nascimento: { type: string, format: date, nullable: true }
                foto_perfil_url: { type: string, nullable: true, description: Endereço https da foto }
                conta_privada: { type: boolean }
                notificacoes_ativas: { type: boolean, description: Chave geral das notificações }
                preferencias_notificacao:
                  type: object
                  description: Assuntos das notificações (os três juntos)
                  properties:
                    ofertas_gerais: { type: boolean }
                    empresas_proximas: { type: boolean }
                    recomendacoes: { type: boolean }
            example:
              biografia: Oi
              data_nascimento: "2008-05-10"
              conta_privada: true
      responses:
        '200':
          description: Dados atualizados (mesmo formato do GET)
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/SemToken' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '500': { $ref: '#/components/responses/ErroServidor' }
    delete:
      tags: [usuarios]
      summary: Exclui a conta e todos os dados dela
      description: |
        Pede a senha atual. Apaga também as empresas da pessoa (com produtos, promoções e avaliações delas),
        listas, salvos, histórico e avaliações feitas. A conta de administradora não pode ser excluída por aqui.
        Senha errada responde 403 (e não 401, para o app não encerrar a sessão).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senha]
              properties:
                senha: { type: string, format: password }
            example:
              senha: "123456"
      responses:
        '200':
          description: Conta excluída
          content:
            application/json:
              example: { mensagem: Conta excluída. }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/SemToken' }
        '403':
          description: Senha incorreta, ou conta de administradora
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: Senha incorreta. }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '500': { $ref: '#/components/responses/ErroServidor' }

  /usuarios/{id}/perfil:
    get:
      tags: [usuarios]
      summary: Perfil de outra pessoa (público)
      description: Conta privada mostra só nome e foto, a não ser para a própria pessoa (com token).
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer }, description: Número do usuário, example: 2 }
      responses:
        '200':
          description: Perfil completo, ou só nome e foto se a conta for privada
          content:
            application/json:
              examples:
                publica:
                  value: { id: 2, nome: Ana, foto_perfil_url: null, biografia: Oi, conta_privada: false, total_avaliacoes: 1, total_fotos: 0, avaliacoes: [], fotos: [] }
                privada:
                  value: { id: 3, nome: Bruno, foto_perfil_url: null, conta_privada: true }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '500': { $ref: '#/components/responses/ErroServidor' }

  /usuarios/me/perfil:
    get:
      tags: [usuarios]
      summary: Avaliações e fotos feitas pelo usuário logado
      description: Só de empresas aprovadas, das mais recentes para as mais antigas.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Totais e listas do perfil
          content:
            application/json:
              example:
                total_avaliacoes: 1
                total_fotos: 1
                avaliacoes:
                  - { id_avaliacao: 1, empresa_id: 1, empresa_nome: Padaria São João, empresa_categoria: Alimentação, nota: 5, comentario: Ótimo pão, criado_em: "2026-11-10T17:00:00.000Z", editado_em: null, fotos: ["https://exemplo.com/foto.jpg"] }
                fotos:
                  - { id_foto: 1, url: "https://exemplo.com/foto.jpg", avaliacao_id: 1, empresa_id: 1, empresa_nome: Padaria São João, criado_em: "2026-11-10T17:00:00.000Z" }
        '401': { $ref: '#/components/responses/SemToken' }
        '500': { $ref: '#/components/responses/ErroServidor' }

  /usuarios/me/solicitar-codigo-senha:
    post:
      tags: [usuarios]
      summary: Troca de senha, passo 1 — envia um código de 6 dígitos por e-mail
      description: O código vale 10 minutos.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Código enviado
          content:
            application/json:
              example: { mensagem: Código enviado para o seu e-mail. }
        '401': { $ref: '#/components/responses/SemToken' }
        '403': { $ref: '#/components/responses/Proibido' }
        '429':
          description: Já foi pedido um código há menos de um minuto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: Espere um minuto para pedir outro código. }
        '500': { $ref: '#/components/responses/ErroServidor' }

  /usuarios/me/senha:
    put:
      tags: [usuarios]
      summary: Troca de senha com a senha atual ou com o código enviado por e-mail
      description: |
        Envie `senhaAtual` (troca normal) **ou** `codigo` (quem esqueceu a senha; peça antes em
        `POST /usuarios/me/solicitar-codigo-senha`). A senha nova precisa de pelo menos 6 caracteres.
        O código vale 10 minutos e é bloqueado depois de 5 erros.
        Com `desconectarOutros: true`, os logins anteriores deixam de valer e a resposta traz um `token` novo para este aparelho.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [novaSenha]
              properties:
                senhaAtual: { type: string, format: password }
                codigo: { type: string }
                novaSenha: { type: string, format: password }
                desconectarOutros: { type: boolean }
            example:
              senhaAtual: "123456"
              novaSenha: novaSenha123
              desconectarOutros: true
      responses:
        '200':
          description: Senha alterada (com `token` quando desconectou os outros)
          content:
            application/json:
              example: { mensagem: Senha alterada com sucesso., token: eyJhbGciOi... }
        '400':
          description: Senha nova curta, código faltando, incorreto (com as tentativas restantes) ou expirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: Código incorreto. Você ainda tem 4 tentativas. }
        '401': { $ref: '#/components/responses/SemToken' }
        '403':
          description: Senha atual incorreta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: A senha atual está incorreta. }
        '500': { $ref: '#/components/responses/ErroServidor' }

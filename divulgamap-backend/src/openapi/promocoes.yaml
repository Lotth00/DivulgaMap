tags:
  - name: promocoes
    description: Promoções normais, especiais e relâmpago

components:
  schemas:
    Promocao:
      type: object
      properties:
        id_promocao: { type: integer, example: 1 }
        empresa_id: { type: integer, example: 1 }
        produto_id: { type: integer, nullable: true, example: 1 }
        tipo: { type: string, enum: [normal, especial, relampago] }
        titulo: { type: string, example: Pão com desconto }
        descricao: { type: string, nullable: true }
        condicao: { type: string, nullable: true, example: Leve 3 pague 2 }
        desconto_percentual: { type: string, nullable: true, example: "20.00" }
        data_inicio: { type: string, format: date-time }
        data_fim: { type: string, format: date-time }
        status: { type: string, enum: [agendada, ativa, expirada] }

paths:
  /promocoes/empresa/{empresaId}:
    get:
      tags: [promocoes]
      summary: Promoções de uma empresa (pública)
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      responses:
        '200':
          description: Lista de promoções, das mais novas para as mais antigas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Promocao' }
        '500': { $ref: '#/components/responses/ErroServidor' }

  /promocoes/relampago/ativas:
    get:
      tags: [promocoes]
      summary: Promoções relâmpago em vigor agora, de qualquer empresa (pública)
      responses:
        '200':
          description: Lista ordenada pela que termina primeiro
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Promocao' }
        '500': { $ref: '#/components/responses/ErroServidor' }

  /promocoes:
    post:
      tags: [promocoes]
      summary: Cria uma promoção
      description: |
        Regras por tipo:
        - **normal**: exige `desconto_percentual`;
        - **especial**: exige `condicao` (ex.: "Leve 3, pague 2");
        - **relampago**: exige `desconto_percentual` ou `condicao` e dura no máximo 24 horas.

        Toda promoção exige `data_inicio` e `data_fim`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [empresa_id, tipo, titulo, data_inicio, data_fim]
              properties:
                empresa_id: { type: integer }
                produto_id: { type: integer, nullable: true }
                tipo: { type: string, enum: [normal, especial, relampago] }
                titulo: { type: string }
                descricao: { type: string }
                condicao: { type: string }
                desconto_percentual: { type: number, minimum: 0, maximum: 100 }
                data_inicio: { type: string, format: date-time }
                data_fim: { type: string, format: date-time }
            examples:
              normal:
                summary: Normal (desconto)
                value:
                  empresa_id: 1
                  produto_id: 1
                  tipo: normal
                  titulo: Pão com desconto
                  desconto_percentual: 20
                  data_inicio: "2026-10-01T00:00:00"
                  data_fim: "2026-12-31T23:59:00"
              especial:
                summary: Especial (condição)
                value:
                  empresa_id: 1
                  tipo: especial
                  titulo: Leve 3 pague 2
                  condicao: Leve 3 pague 2
                  data_inicio: "2026-10-01T00:00:00"
                  data_fim: "2026-12-31T23:59:00"
              relampago:
                summary: Relâmpago (até 24 h)
                value:
                  empresa_id: 1
                  produto_id: 1
                  tipo: relampago
                  titulo: Só hoje
                  desconto_percentual: 50
                  data_inicio: "2026-11-02T10:00:00"
                  data_fim: "2026-11-02T12:00:00"
      responses:
        '201':
          description: Promoção criada (status `agendada`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Promocao' }
        '400':
          description: Campos que faltam para o tipo, ou relâmpago com mais de 24 horas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: Promoções relâmpago devem durar no máximo 24 horas. }
        '401': { $ref: '#/components/responses/SemToken' }
        '403': { $ref: '#/components/responses/Proibido' }
        '500': { $ref: '#/components/responses/ErroServidor' }

tags:
  - name: promocoes
    description: Promoções normais, especiais e relâmpago

components:
  schemas:
    Promocao:
      type: object
      properties:
        id_promocao: { type: integer, example: 1 }
        empresa_id: { type: integer, example: 1 }
        produto_id: { type: integer, nullable: true, example: 1 }
        tipo: { type: string, enum: [normal, especial, relampago] }
        titulo: { type: string, example: Pão com desconto }
        descricao: { type: string, nullable: true }
        condicao: { type: string, nullable: true, example: Leve 3 pague 2 }
        desconto_percentual: { type: string, nullable: true, example: "20.00" }
        data_inicio: { type: string, format: date-time }
        data_fim: { type: string, format: date-time }
        status: { type: string, enum: [agendada, ativa, expirada], description: Calculado pelas datas; encerrada pelo dono é sempre expirada }

paths:
  /promocoes/empresa/{empresaId}:
    get:
      tags: [promocoes]
      summary: Promoções de uma empresa (pública)
      description: Empresa não aprovada só aparece para o dono ou admin (com token); para os outros, 404.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      responses:
        '200':
          description: Lista de promoções, das mais novas para as mais antigas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Promocao' }
        '500': { $ref: '#/components/responses/ErroServidor' }

  /promocoes/ativas:
    get:
      tags: [promocoes]
      summary: Ofertas em vigor agora, de empresas aprovadas (pública)
      description: |
        As datas das promoções são lidas no horário de Brasília.
        Com `lat` e `lng`, cada item traz `distancia_km` e a lista vai da mais próxima para a mais distante;
        sem eles, da que termina primeiro.
        Para a imagem do card: `foto_produto`; sem ela, a imagem padrão da `categoria`; sem produto, `foto_empresa`.
      parameters:
        - in: query
          name: tipo
          schema: { type: string, enum: [normal, especial, relampago] }
        - in: query
          name: empresa
          description: Só as ofertas desta empresa (id_empresa)
          schema: { type: integer }
        - in: query
          name: lat
          schema: { type: number }
          example: -29.65
        - in: query
          name: lng
          schema: { type: number }
          example: -50.78
        - in: query
          name: limite
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Lista de ofertas (pode ser vazia)
          content:
            application/json:
              example:
                - id: 1
                  tipo: normal
                  titulo: Pão com desconto
                  descricao: null
                  condicao: null
                  desconto_percentual: "20.00"
                  data_inicio: "2026-10-01T00:00:00"
                  data_fim: "2026-12-31T23:59:00"
                  em_vigor: true
                  empresa_id: 1
                  empresa_nome: Padaria São João
                  endereco: Rua Júlio de Castilhos, 2000
                  bairro: Centro
                  latitude: "-29.6481206"
                  longitude: "-50.7809299"
                  produto_id: 1
                  produto_nome: Pão francês
                  produto_descricao: null
                  tipo_item: produto
                  unidade_medida: un
                  preco_original: "1.50"
                  preco_promocional: "1.20"
                  foto_produto: null
                  foto_empresa: null
                  categoria: Alimentação
                  distancia_km: 0.42
        '400':
          description: Tipo, coordenadas ou limite inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: 'Tipo inválido. Use "normal", "especial" ou "relampago".' }
        '500': { $ref: '#/components/responses/ErroServidor' }

  /promocoes/{id}:
    get:
      tags: [promocoes]
      summary: Detalhe de uma oferta (pública)
      description: |
        Mesmos campos de `/promocoes/ativas` (sem `distancia_km`). Também devolve ofertas encerradas
        ou ainda não iniciadas: `em_vigor` diz se ela vale agora.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          example: 1
      responses:
        '200':
          description: A oferta
        '400':
          description: id inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '404':
          description: Oferta não existe, empresa não aprovada ou produto indisponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: 'Oferta não encontrada.' }
        '500': { $ref: '#/components/responses/ErroServidor' }
    put:
      tags: [promocoes]
      summary: Edita uma promoção (só o dono)
      description: |
        Só os campos enviados mudam; o resultado passa pelas mesmas regras por tipo do `POST /promocoes`
        (inclusive o máximo de 24 horas da relâmpago). `null` ou texto vazio apaga `descricao`, `condicao`,
        `desconto_percentual` e `produto_id`. Promoção encerrada não pode ser editada.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: Número da promoção (id_promocao)
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                produto_id: { type: integer, nullable: true }
                tipo: { type: string, enum: [normal, especial, relampago] }
                titulo: { type: string, maxLength: 150 }
                descricao: { type: string, nullable: true }
                condicao: { type: string, nullable: true, maxLength: 255 }
                desconto_percentual: { type: number, nullable: true, minimum: 0, maximum: 100 }
                data_inicio: { type: string, format: date-time }
                data_fim: { type: string, format: date-time }
            examples:
              desconto:
                summary: Muda só o desconto
                value: { desconto_percentual: 30 }
              relampagoLonga:
                summary: Relâmpago com 30 horas (dá 400)
                value: { data_inicio: "2026-11-20T08:00:00", data_fim: "2026-11-21T14:00:00" }
      responses:
        '200':
          description: Promoção editada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Promocao' }
        '400':
          description: Regra do tipo não atendida, produto de outra empresa ou promoção já encerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: Promoções relâmpago devem durar no máximo 24 horas. }
        '401': { $ref: '#/components/responses/SemToken' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404':
          description: Promoção não existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: Promoção não encontrada. }
        '500': { $ref: '#/components/responses/ErroServidor' }
    delete:
      tags: [promocoes]
      summary: Encerra uma promoção (só o dono)
      description: |
        A promoção termina agora (`data_fim` = agora, no horário de Brasília) e fica com status `expirada`.
        Some de `/promocoes/ativas` e continua no banco. Se ainda não tinha começado, `data_inicio` também vira agora.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: Número da promoção (id_promocao)
          example: 1
      responses:
        '200':
          description: Promoção encerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Promocao' }
        '400':
          description: Promoção já encerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: Esta promoção já foi encerrada. }
        '401': { $ref: '#/components/responses/SemToken' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404':
          description: Promoção não existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: Promoção não encontrada. }
        '500': { $ref: '#/components/responses/ErroServidor' }

  /promocoes/relampago/ativas:
    get:
      tags: [promocoes]
      summary: Promoções relâmpago em vigor agora, de empresas aprovadas (pública)
      responses:
        '200':
          description: Lista ordenada pela que termina primeiro
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Promocao' }
        '500': { $ref: '#/components/responses/ErroServidor' }

  /promocoes:
    post:
      tags: [promocoes]
      summary: Cria uma promoção
      description: |
        Regras por tipo:
        - **normal**: exige `desconto_percentual`;
        - **especial**: exige `condicao` (ex.: "Leve 3, pague 2");
        - **relampago**: exige `desconto_percentual` ou `condicao` e dura no máximo 24 horas.

        Toda promoção exige `data_inicio` e `data_fim` (a fim depois do início). As datas valem no horário de Brasília:
        sem fuso (`2026-12-31T23:59:00`) são usadas como estão; com `Z` ou deslocamento (`...T17:00:00.000Z`) são convertidas.
        `desconto_percentual`, quando enviado, vai de 0 (exclusivo) a 100.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [empresa_id, tipo, titulo, data_inicio, data_fim]
              properties:
                empresa_id: { type: integer }
                produto_id: { type: integer, nullable: true }
                tipo: { type: string, enum: [normal, especial, relampago] }
                titulo: { type: string }
                descricao: { type: string }
                condicao: { type: string }
                desconto_percentual: { type: number, minimum: 0, maximum: 100 }
                data_inicio: { type: string, format: date-time }
                data_fim: { type: string, format: date-time }
            examples:
              normal:
                summary: Normal (desconto)
                value:
                  empresa_id: 1
                  produto_id: 1
                  tipo: normal
                  titulo: Pão com desconto
                  desconto_percentual: 20
                  data_inicio: "2026-10-01T00:00:00"
                  data_fim: "2026-12-31T23:59:00"
              especial:
                summary: Especial (condição)
                value:
                  empresa_id: 1
                  tipo: especial
                  titulo: Leve 3 pague 2
                  condicao: Leve 3 pague 2
                  data_inicio: "2026-10-01T00:00:00"
                  data_fim: "2026-12-31T23:59:00"
              relampago:
                summary: Relâmpago (até 24 h)
                value:
                  empresa_id: 1
                  produto_id: 1
                  tipo: relampago
                  titulo: Só hoje
                  desconto_percentual: 50
                  data_inicio: "2026-11-02T10:00:00"
                  data_fim: "2026-11-02T12:00:00"
      responses:
        '201':
          description: Promoção criada (status `agendada`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Promocao' }
        '400':
          description: Campos que faltam para o tipo, relâmpago com mais de 24 horas ou produto de outra empresa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: Promoções relâmpago devem durar no máximo 24 horas. }
        '401': { $ref: '#/components/responses/SemToken' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '500': { $ref: '#/components/responses/ErroServidor' }

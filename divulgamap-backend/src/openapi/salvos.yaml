tags:
  - name: salvos
    description: Empresas e produtos salvos dentro das listas

paths:
  /salvos/lista/{listaId}:
    get:
      tags: [salvos]
      summary: Itens de uma lista do usuário logado
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: listaId
          required: true
          schema: { type: integer }
          description: Número da lista (id_lista)
          example: 1
      responses:
        '200':
          description: Itens salvos
          content:
            application/json:
              example:
                - { id_salvo: 1, lista_id: 1, usuario_id: 1, tipo_item: empresa, item_id: 1 }
        '401': { $ref: '#/components/responses/SemToken' }
        '403':
          description: Token inválido, ou a lista não existe ou é de outra pessoa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: Você não pode ver esta lista. }
        '500': { $ref: '#/components/responses/ErroServidor' }

  /salvos:
    post:
      tags: [salvos]
      summary: Salva uma empresa ou um produto numa lista
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lista_id, tipo_item, item_id]
              properties:
                lista_id: { type: integer }
                tipo_item: { type: string, enum: [empresa, produto] }
                item_id: { type: integer }
            example:
              lista_id: 1
              tipo_item: empresa
              item_id: 1
      responses:
        '201':
          description: Item salvo
          content:
            application/json:
              example: { id_salvo: 1, lista_id: 1, usuario_id: 1, tipo_item: empresa, item_id: 1 }
        '400':
          description: Item não encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: Item não encontrado. }
        '401': { $ref: '#/components/responses/SemToken' }
        '403':
          description: Token inválido, ou a lista não existe ou é de outra pessoa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: Você não pode adicionar nesta lista. }
        '500': { $ref: '#/components/responses/ErroServidor' }

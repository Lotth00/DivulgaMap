tags:
  - name: auth
    description: Cadastro e login

paths:
  /auth/cadastro:
    post:
      tags: [auth]
      summary: Cadastra um usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha]
              properties:
                nome: { type: string }
                email: { type: string, format: email }
                senha: { type: string, format: password }
            example:
              nome: Ana Souza
              email: ana.souza@exemplo.com
              senha: "123456"
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              example: { id: 3, nome: Ana Souza, email: ana.souza@exemplo.com }
        '400':
          description: E-mail já cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: E-mail já cadastrado. }
        '500': { $ref: '#/components/responses/ErroServidor' }

  /auth/login:
    post:
      tags: [auth]
      summary: Faz login e devolve o token (válido por 7 dias)
      description: Copie o valor de `token` (sem as aspas) e cole em **Authorize**. O e-mail diferencia maiúsculas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: { type: string, format: email }
                senha: { type: string, format: password }
            example:
              email: teste@teste.com
              senha: "123456"
      responses:
        '200':
          description: Login feito
          content:
            application/json:
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                usuario: { id: 1, nome: Teste, email: teste@teste.com, tipo: consumidor }
        '401':
          description: E-mail ou senha inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { erro: E-mail ou senha inválidos. }
        '500': { $ref: '#/components/responses/ErroServidor' }
